spring:
  application:
    name: nhakhoa

  datasource:
    url: "${DBMS_CONNECTION:jdbc:sqlserver://localhost:14333;databaseName=NhaKhoa;encrypt=true;trustServerCertificate=true}"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

server:
  port: 8386
  servlet:
    context-path: /manage

